<title>Reliquo Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Figtree:ital,wght@0,400..700;1,400..700&family=Work+Sans:ital,wght@0,400..700;1,400..700&family=Hanken+Grotesk:wght@400;500;600&family=Quicksand:wght@700&display=swap">
<style>
/* Layout: identical to Madden's reference draft (the peach version from early on): full peach photo on the right with its backdrop carried across the screen, big three-line Bodoni headline on the left, video frame at the same spot above the short pedestal. Only differences: a sticky barn-red header and the new colours. Single light look by choice. */
:root {
  /* Madden's swatches */
  --barn: #69200F;     /* barn red: sticky header, headline and small text */
  --rufous: #A33215;   /* rufous: buttons */
  --sand: #C78054;     /* sand: "evenings" */
  --cream: #FBF3EA;
  --frame: rgba(105, 32, 15, 0.32);

  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --brand: "Quicksand", "Nunito", sans-serif;
  --side: clamp(20px, 4.2vw, 80px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: #E0C0AB; }
body {
  min-height: 100vh; margin: 0;
  background: linear-gradient(180deg, #E0C0AB 0%, #E2C0AA 40%, #E5C8B5 60%, #E2CABA 85%, #E5CEBE 100%);
  color: var(--barn);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--barn); outline-offset: 4px; }

/* ---------- Sticky header ---------- */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 14px var(--side);
  background: var(--barn); color: var(--cream);
}
.nav :focus-visible { outline-color: var(--cream); }
.logo { display: flex; align-items: center; min-height: 44px; font-family: var(--brand); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; text-decoration: none; }
.links { display: flex; gap: 40px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; text-underline-offset: 6px; }
.box {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--rufous); color: var(--cream);
  font: 600 0.9rem/1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase;
  padding: 20px 34px; text-decoration: none; border: 0; border-radius: 0; white-space: nowrap;
}
.box:hover { background: var(--barn); }
.nav .box { padding: 16px 28px; }
.nav .box:hover { background: #B8401F; }
@media (max-width: 1100px) { .links { display: none; } }
@media (max-width: 960px) { .nav .box { padding: 13px 18px; font-size: 0.8rem; } }

/* ---------- Hero (same geometry as the reference) ---------- */
.hero {
  position: relative;
  min-height: max(calc(100svh - 72px), 720px);
  overflow: hidden;
  isolation: isolate;
  display: grid;
  grid-template-rows: 1fr;
  padding-inline: var(--side);
  padding-bottom: 48px;
}
.stage { position: absolute; z-index: 0; top: 0; right: 0; bottom: 0; aspect-ratio: 500 / 889; height: 100%; }
.art {
  position: absolute; inset: 0;
  background: url("hero-peach.png") center bottom / cover no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) 14%, #000 32%);
          mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) 14%, #000 32%);
}
/* Video: placed by the script below so it sits in the pocket right of "back." and under "evenings",
   with equal gaps to the text, the short pillar (below) and the tall pillar (right). */
.video { position: absolute; z-index: 1; right: 34%; top: 34%; width: 36%; margin: 0; }
.video .frame {
  aspect-ratio: 16 / 9; max-width: 100%;
  border: 1px solid var(--frame);
  background: rgba(251, 244, 238, 0.28);
  backdrop-filter: blur(4px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
}
.video .frame svg { width: 52px; height: 52px; color: var(--barn); opacity: 0.85; }
.video .frame span { font-size: 0.85rem; color: var(--barn); }
/* When the video is ready, swap the .frame div for:
   <video class="frame" controls preload="none" playsinline poster="poster.jpg">
     <source src="your-video.mp4" type="video/mp4">
   </video> */
video.frame { width: 100%; height: auto; display: block; object-fit: cover; }

.main { position: relative; z-index: 2; align-self: center; max-width: min(56%, 760px); }
.hero.placed .main { position: absolute; left: var(--side); width: min(56%, 760px); }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3.4rem, min(8.4vw, 9.6vh), 9rem);
  font-size: clamp(3.4rem, min(8.4vw, 9.6svh), 9rem);
  line-height: 0.92;
  letter-spacing: -0.035em;
  font-variation-settings: "opsz" 96;
  color: var(--barn);
}
h1 .l { display: block; }
h1 .it { font-style: italic; font-weight: 500; padding-left: 0.6em; color: var(--sand); }
h1 .big { font-weight: 800; }

/* Headline font options (draft picker) */
:root[data-font="caslon"] { --display: "Libre Caslon Text", "Baskerville", Georgia, serif; }
:root[data-font="source"] { --display: "Source Serif 4", "Iowan Old Style", Georgia, serif; }
:root[data-font="lora"] { --display: "Lora", "Palatino", Georgia, serif; }
:root[data-font="figtree"] { --display: "Figtree", "Segoe UI", system-ui, sans-serif; }
:root[data-font="work"] { --display: "Work Sans", "Helvetica Neue", Arial, sans-serif; }
:root[data-font="caslon"] h1 { font-size: clamp(3rem, min(7.2vw, 8.2svh), 7.8rem); letter-spacing: -0.025em; line-height: 0.98; font-variation-settings: normal; }
:root[data-font="caslon"] h1 .it { font-weight: 400; }
:root[data-font="caslon"] h1 .big { font-weight: 700; }
:root[data-font="source"] h1 { font-size: clamp(3.2rem, min(7.8vw, 8.9svh), 8.4rem); letter-spacing: -0.03em; line-height: 0.95; font-variation-settings: "opsz" 60; }
:root[data-font="source"] h1 .it { font-weight: 400; }
:root[data-font="source"] h1 .big { font-weight: 700; }
:root[data-font="lora"] h1 { font-size: clamp(3.1rem, min(7.6vw, 8.7svh), 8.2rem); letter-spacing: -0.025em; line-height: 0.98; font-variation-settings: normal; }
:root[data-font="lora"] h1 .it { font-weight: 400; }
:root[data-font="lora"] h1 .big { font-weight: 700; }
:root[data-font="figtree"] h1 { font-weight: 500; font-size: clamp(3.1rem, min(7.6vw, 8.7svh), 8.2rem); letter-spacing: -0.045em; line-height: 0.96; font-variation-settings: normal; }
:root[data-font="figtree"] h1 .it { font-weight: 400; }
:root[data-font="figtree"] h1 .big { font-weight: 700; }
:root[data-font="work"] h1 { font-weight: 500; font-size: clamp(2.9rem, min(7.1vw, 8.1svh), 7.6rem); letter-spacing: -0.05em; line-height: 0.98; font-variation-settings: normal; }
:root[data-font="work"] h1 .it { font-weight: 400; }
:root[data-font="work"] h1 .big { font-weight: 700; }

/* Draft-only font picker (floating, can be hidden) */
.picker {
  position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 32px);
  background: #FFFFFF; color: #2B1A14;
  border: 1px solid rgba(105, 32, 15, 0.18);
  box-shadow: 0 18px 40px -18px rgba(40, 15, 8, 0.45);
  padding: 12px 16px 14px; display: grid; gap: 10px;
  font: 500 0.88rem/1.2 var(--sans);
}
.picker-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.picker-head b { font-weight: 600; }
.picker .toggle { background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: #5A3B30; font: inherit; }
.picker .fonts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.picker .fonts button { flex: none; background: transparent; border: 1px solid rgba(105, 32, 15, 0.28); color: #2B1A14; padding: 8px 14px; cursor: pointer; font-size: 1.02rem; border-radius: 0; }
.picker .fonts button[aria-pressed="true"] { background: var(--barn); color: var(--cream); border-color: var(--barn); }
.picker button[data-v="bodoni"] { font-family: "Bodoni Moda", serif; }
.picker button[data-v="caslon"] { font-family: "Libre Caslon Text", serif; }
.picker button[data-v="source"] { font-family: "Source Serif 4", serif; }
.picker button[data-v="lora"] { font-family: "Lora", serif; }
.picker button[data-v="figtree"] { font-family: "Figtree", sans-serif; }
.picker button[data-v="work"] { font-family: "Work Sans", sans-serif; }
.picker.closed .fonts { display: none; }

/* Phones and small tablets: text first, then the video, then the photo */
@media (max-width: 860px) {
  .hero { min-height: auto; grid-template-rows: auto auto auto; padding-top: 32px; padding-bottom: 0; }
  .main { max-width: none; padding-bottom: 28px; }
  .stage { position: relative; inset: auto; aspect-ratio: auto; height: auto; display: grid; margin-inline: calc(-1 * var(--side)); }
  .video { position: relative; left: auto; top: auto; right: auto; width: auto; margin: 0 0 8px; }
  .art { position: relative; inset: auto; height: 440px; background-size: cover; background-position: center 60%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 30%); }
}
</style>

<header class="nav">
  <!-- Logo spot: swap the wordmark for <img src="logo.svg" alt="Reliquo" height="44"> when the logo is ready -->
  <a class="logo" href="#">Reliquo</a>
  <nav class="links" aria-label="Main">
    <a href="#">How it works</a>
    <a href="#">Pricing</a>
    <a href="#">Questions</a>
  </nav>
  <a class="box" href="#">Book a free chat</a>
</header>

<div class="picker" id="picker" role="region" aria-label="Draft font picker">
  <div class="picker-head"><b>Try a headline font</b><button type="button" class="toggle" id="picker-toggle">Hide</button></div>
  <div class="fonts" role="group" aria-label="Headline font">
    <button type="button" data-v="bodoni" aria-pressed="true">Current (Bodoni)</button>
    <button type="button" data-v="caslon" aria-pressed="false">Caslon</button>
    <button type="button" data-v="source" aria-pressed="false">Source Serif</button>
    <button type="button" data-v="lora" aria-pressed="false">Lora</button>
    <button type="button" data-v="figtree" aria-pressed="false">Figtree</button>
    <button type="button" data-v="work" aria-pressed="false">Work Sans</button>
  </div>
</div>

<section class="hero">
  <div class="main">
    <h1><span class="l">Get your</span><span class="l it">evenings</span><span class="l big">back.</span></h1>
  </div>

  <figure class="video">
    <div class="frame" aria-label="Video space, coming soon">
      <svg viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="27" stroke="currentColor" stroke-width="1.5"/><path d="M23 19.5v17l14-8.5-14-8.5Z" fill="currentColor"/></svg>
      <span>Video coming soon</span>
    </div>
  </figure>

  <div class="stage">
    <div class="art" aria-hidden="true"></div>
  </div>
</section>

<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll('.picker .fonts button');
    var valid = Array.prototype.map.call(buttons, function (b) { return b.dataset.v; });
    function pick(v) {
      if (valid.indexOf(v) === -1) v = 'bodoni';
      if (v === 'bodoni') root.removeAttribute('data-font'); else root.setAttribute('data-font', v);
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'); });
      try { localStorage.setItem('reliquo-headline-font', v); } catch (e) {}
      if (window.reliquoLayout) window.reliquoLayout();
    }
    buttons.forEach(function (b) { b.addEventListener('click', function () { pick(b.dataset.v); }); });
    var saved = 'bodoni';
    try { saved = localStorage.getItem('reliquo-headline-font') || 'bodoni'; } catch (e) {}
    pick(saved);
    var panel = document.getElementById('picker');
    var toggle = document.getElementById('picker-toggle');
    toggle.addEventListener('click', function () {
      var closed = panel.classList.toggle('closed');
      toggle.textContent = closed ? 'Show' : 'Hide';
    });
  })();
</script>

<script>
  /* Places the video and headline using the real positions of the pillars in the photo.
     Photo is 500 x 889 px; measured edges: short pillar top = row 570, tall pillar left edge = column 336. */
  (function () {
    var IMG_H = 889, SHORT_TOP = 570, TALL_LEFT = 336;
    var hero = document.querySelector('.hero');
    var main = document.querySelector('.main');
    var video = document.querySelector('.video');
    var stage = document.querySelector('.stage');
    function box(el) { var r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); }
    function layout() {
      if (window.innerWidth <= 860) {
        hero.classList.remove('placed'); main.style.top = ''; video.removeAttribute('style'); return;
      }
      hero.classList.add('placed');
      main.style.top = '0px';
      var H = hero.getBoundingClientRect(), S = stage.getBoundingClientRect(), M = main.getBoundingClientRect();
      var s = S.height / IMG_H;
      var gap = Math.max(14, Math.min(28, window.innerWidth * 0.018));
      var first = box(main.querySelector('.l')), ev = box(main.querySelector('.it')), back = box(main.querySelector('.big'));
      var firstTop = first.top - M.top, evBottom = ev.bottom - M.top;
      var bottom = (S.top - H.top) + SHORT_TOP * s - gap;      // just above the short pillar
      var right = (S.left - H.left) + TALL_LEFT * s - gap;     // just left of the tall pillar
      var left = (back.right - H.left) + gap;                  // just right of "back."
      var width = right - left, height = width * 9 / 16, top = bottom - height;
      var mainTop = top - gap - evBottom;                      // "evenings" sits one gap above the video
      var minTop = 24;
      if (mainTop + firstTop < minTop) {                       // wide screens: keep the pillar gaps, shrink to fit under "evenings"
        mainTop = minTop - firstTop;
        top = mainTop + evBottom + gap;
        height = bottom - top; width = height * 16 / 9; left = right - width;
      }
      main.style.top = Math.round(mainTop) + 'px';
      video.style.right = 'auto';
      video.style.left = Math.round(left) + 'px';
      video.style.top = Math.round(top) + 'px';
      video.style.width = Math.round(width) + 'px';
    }
    window.reliquoLayout = layout;
    layout();
    window.addEventListener('resize', layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    window.addEventListener('load', layout);
  })();
</script>
