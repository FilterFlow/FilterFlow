<title>Reliquo Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Unbounded:wght@300;500;800&family=Shrikhand&family=Big+Shoulders+Display:wght@500;800;900&family=Hanken+Grotesk:wght@400;500;600&family=Quicksand:wght@700&display=swap">
<style>
/* Layout: one calm peach room. The pedestal photo sits on the right and its seamless backdrop continues across the whole screen, so the left side is open space for the logo, headline and button. The video frame floats in the empty air above the short pedestal. Nothing else. Single warm-light look by choice. */
:root {
  --peach-top: #E0C0AB;
  --peach-mid: #E5C8B5;
  --peach-low: #E5CEBE;
  --brown: #3A2A1F;
  --brown-soft: #5E4637;
  --clay: #8A5A3A;
  --cream: #FBF4EE;
  --frame: rgba(58, 42, 31, 0.32);

  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --brand: "Quicksand", "Nunito", sans-serif;

  --side: clamp(20px, 4.2vw, 80px);
  color-scheme: light;
}
:root[data-font="unbounded"] { --display: "Unbounded", "Arial Black", sans-serif; }
:root[data-font="shrikhand"] { --display: "Shrikhand", "Cooper Black", serif; }
:root[data-font="shoulders"] { --display: "Big Shoulders Display", "Impact", sans-serif; }

* { box-sizing: border-box; }
html { background: var(--peach-low); }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--peach-top) 0%, #E2C0AA 40%, var(--peach-mid) 60%, #E2CABA 85%, var(--peach-low) 100%);
  color: var(--brown);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brown); outline-offset: 4px; }

/* Draft-only font picker */
.draft {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px var(--side);
  background: rgba(58, 42, 31, 0.08); color: var(--brown-soft);
  font-size: 0.85rem;
}
.draft .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.draft button { background: transparent; border: 1px solid var(--frame); color: var(--brown); padding: 5px 12px; cursor: pointer; font-size: 0.85rem; border-radius: 0; }
.draft button[aria-pressed="true"] { background: var(--brown); color: var(--cream); border-color: var(--brown); }
.draft button[data-f="bodoni"] { font-family: "Bodoni Moda", serif; font-style: italic; }
.draft button[data-f="unbounded"] { font-family: "Unbounded", sans-serif; }
.draft button[data-f="shrikhand"] { font-family: "Shrikhand", serif; }
.draft button[data-f="shoulders"] { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; letter-spacing: 0.04em; }

.hero {
  position: relative;
  min-height: max(calc(100svh - 46px), 720px);
  overflow: hidden;
  isolation: isolate;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-inline: var(--side);
  padding-bottom: 48px;
}

/* ---------- Photo + video stage (sized to the photo) ---------- */
.stage {
  position: absolute; z-index: 0; top: 0; right: 0; bottom: 0;
  aspect-ratio: 500 / 889; height: 100%;
}
.art {
  position: absolute; inset: 0;
  background: url("hero-peach.png") center bottom / cover no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) 14%, #000 32%);
          mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) 14%, #000 32%);
}
.video {
  position: absolute; z-index: 1;
  left: -22%; top: 19%; width: 80%;
  margin: 0; display: grid; gap: 10px;
}
.video .frame {
  aspect-ratio: 16 / 9; max-width: 100%;
  border: 1px solid var(--frame);
  background: rgba(251, 244, 238, 0.28);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
}
.video .frame svg { width: 52px; height: 52px; color: var(--brown); opacity: 0.85; }
.video figcaption { font-size: 0.85rem; color: var(--brown-soft); }
/* When the video is ready, swap the .frame div for:
   <video class="frame" controls preload="none" playsinline poster="poster.jpg">
     <source src="your-video.mp4" type="video/mp4">
   </video> */
video.frame { width: 100%; height: auto; display: block; object-fit: cover; }

/* ---------- Content ---------- */
.nav { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 26px; }
.logo { display: flex; align-items: center; min-height: 44px; font-family: var(--brand); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; text-decoration: none; }
.links { display: flex; gap: 40px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; text-underline-offset: 6px; }
.box {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brown); color: var(--cream);
  font: 600 0.9rem/1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase;
  padding: 20px 34px; text-decoration: none; border: 0; border-radius: 0; white-space: nowrap;
}
.box:hover { background: var(--clay); }
@media (max-width: 1100px) { .links { display: none; } }
@media (max-width: 960px) { .nav .box { padding: 15px 20px; font-size: 0.8rem; } }

.main { position: relative; z-index: 2; align-self: center; display: grid; gap: clamp(28px, 4vw, 44px); padding-block: 24px 40px; max-width: min(56%, 760px); }

h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3.4rem, 8.4vw, 9rem);
  line-height: 0.92;
  letter-spacing: -0.035em;
  font-variation-settings: "opsz" 96;
  color: var(--brown);
}
h1 .l { display: block; }
h1 .it { font-style: italic; font-weight: 500; padding-left: 0.6em; color: var(--clay); }
h1 .big { font-weight: 800; }
:root[data-font="unbounded"] h1 { font-size: clamp(2.6rem, 6vw, 6.2rem); letter-spacing: -0.05em; line-height: 0.98; }
:root[data-font="unbounded"] h1 .l:first-child, :root[data-font="unbounded"] h1 .big { font-weight: 300; }
:root[data-font="unbounded"] h1 .it { font-style: normal; font-weight: 800; }
:root[data-font="shrikhand"] h1 { font-size: clamp(3rem, 7.6vw, 8rem); letter-spacing: -0.01em; line-height: 1; }
:root[data-font="shrikhand"] h1 .it, :root[data-font="shrikhand"] h1 .big { font-style: normal; font-weight: 400; }
:root[data-font="shoulders"] h1 { font-size: clamp(4.4rem, 11.5vw, 12.5rem); letter-spacing: -0.01em; line-height: 0.84; text-transform: uppercase; }
:root[data-font="shoulders"] h1 .it { font-style: normal; font-weight: 500; padding-left: 0; }
:root[data-font="shoulders"] h1 .l:first-child, :root[data-font="shoulders"] h1 .big { font-weight: 900; }

.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 26px; }
.cta p { margin: 0; font-size: 1rem; line-height: 1.45; color: var(--brown-soft); max-width: 24ch; }

/* Phones and small tablets: text first, then the video, then the photo */
@media (max-width: 860px) {
  .hero { min-height: auto; grid-template-rows: auto auto auto; padding-bottom: 0; }
  .main { max-width: none; padding-bottom: 28px; }
  .stage { position: relative; inset: auto; aspect-ratio: auto; height: auto; display: grid; gap: 0; margin-inline: calc(-1 * var(--side)); }
  .video { position: relative; left: auto; top: auto; width: auto; margin: 0 var(--side) 8px; }
  .art { position: relative; inset: auto; height: 440px; background-size: cover; background-position: center 60%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 30%); }
}
</style>

<div class="draft" role="group" aria-label="Try a headline font (draft only)">
  <span>Draft: try a headline font</span>
  <div class="opts">
    <button type="button" data-f="bodoni" aria-pressed="true">Bodoni</button>
    <button type="button" data-f="unbounded" aria-pressed="false">Unbounded</button>
    <button type="button" data-f="shrikhand" aria-pressed="false">Shrikhand</button>
    <button type="button" data-f="shoulders" aria-pressed="false">Big Shoulders</button>
  </div>
</div>

<section class="hero">
  <header class="nav">
    <!-- Logo spot: swap the wordmark for <img src="logo.svg" alt="Reliquo" height="44"> when the logo is ready -->
    <a class="logo" href="#">Reliquo</a>
    <nav class="links" aria-label="Main">
      <a href="#">How it works</a>
      <a href="#">Pricing</a>
      <a href="#">Questions</a>
    </nav>
    <a class="box" href="#">Book a free chat</a>
  </header>

  <div class="main">
    <h1><span class="l">Get your</span><span class="l it">evenings</span><span class="l big">back.</span></h1>
    <div class="cta">
      <a class="box" href="#">Book a free chat</a>
      <p>A free 20-minute call, or coffee in Winnipeg. No pressure.</p>
    </div>
  </div>

  <div class="stage">
    <figure class="video">
      <div class="frame" aria-label="Video space, coming soon">
        <svg viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="27" stroke="currentColor" stroke-width="1.5"/><path d="M23 19.5v17l14-8.5-14-8.5Z" fill="currentColor"/></svg>
      </div>
      <figcaption>Video coming soon</figcaption>
    </figure>
    <div class="art" aria-hidden="true"></div>
  </div>
</section>

<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll('.draft button');
    function pick(f) {
      if (f === 'bodoni') root.removeAttribute('data-font'); else root.setAttribute('data-font', f);
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.f === f ? 'true' : 'false'); });
      try { localStorage.setItem('reliquo-font', f); } catch (e) {}
    }
    buttons.forEach(function (b) { b.addEventListener('click', function () { pick(b.dataset.f); }); });
    try { var saved = localStorage.getItem('reliquo-font'); if (saved) pick(saved); } catch (e) {}
  })();
</script>
