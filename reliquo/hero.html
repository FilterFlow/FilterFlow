<title>Reliquo Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Jost:ital,wght@0,300..600;1,300..500&family=Shrikhand&family=Hanken+Grotesk:wght@400;500;600&family=Quicksand:wght@700&display=swap">
<style>
/* Layout: one calm room. A photo sits on the right and its own backdrop continues across the screen, so the left side is open space for the logo, headline and button. The video frame floats in the photo's empty space. Draft bar lets Madden swap photos and headline fonts. Single light look by choice. */
:root {
  --cream: #FBF4EE;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --brand: "Quicksand", "Nunito", sans-serif;
  --side: clamp(20px, 4.2vw, 80px);

  /* Text and controls (defaults suit the light photos) */
  --brown: #3A2A1F;
  --brown-soft: #5E4637;
  --clay: #8A5A3A;
  --nav-fg: var(--brown);
  --navbtn-bg: var(--brown); --navbtn-fg: var(--cream);
  --btn-bg: var(--brown); --btn-fg: var(--cream);
  --frame: rgba(58, 42, 31, 0.32);
  --frame-fill: rgba(251, 244, 238, 0.28);
  --play: var(--brown);
  --cap: var(--brown-soft);

  /* Photo: peach pedestals (default) */
  --img: url("hero-peach.png");
  --ratio: 500 / 889;
  --art-pos: center bottom;
  --page: linear-gradient(180deg, #E0C0AB 0%, #E2C0AA 40%, #E5C8B5 60%, #E2CABA 85%, #E5CEBE 100%);
  --page-solid: #E0C0AB;
  --vx: -22%; --vy: 19%; --vw: 80%;
  --m-pos: center 60%;
  --fade-a: 14%; --fade-b: 32%;
  color-scheme: light;
}
/* Photo: white curtains (mirrored so the vase sits on the right) */
:root[data-img="curtain"] {
  --img: url("hero-curtain.png");
  --ratio: 500 / 750;
  --page: linear-gradient(180deg, #EEEEEC 0%, #ECECEA 40%, #E8E8E4 72%, #E3E2DD 82%, #B8B1A5 89%, #B4ADA1 100%);
  --page-solid: #EEEEEC;
  --vx: -20%; --vy: 13%; --vw: 72%;
  --m-pos: center bottom;
}
/* Photo: evening sun on a wall, couch and stool */
:root[data-img="sunlit"] {
  --img: url("hero-sunlit.png");
  --ratio: 645 / 1030;
  --art-pos: right bottom;
  --fade-a: 28%; --fade-b: 52%;
  --page: linear-gradient(180deg, #DFBC91 0%, #E4C399 25%, #E7C79F 45%, #DBB68A 65%, #D3AD80 78%, #A88459 100%);
  --page-solid: #DFBC91;
  --vx: -20%; --vy: 14%; --vw: 72%;
  --m-pos: center 80%;
}
/* Photo: orange lamp glow (mirrored so the lamp sits on the right) */
:root[data-img="lamp"] {
  --img: url("hero-lamp.png");
  --ratio: 500 / 750;
  --page: linear-gradient(180deg, #7A3E08 0%, #A85203 14%, #D06C04 28%, #EB8410 45%, #F49A30 62%, #EE9025 80%, #C86A12 100%);
  --page-solid: #7A3E08;
  --vx: -20%; --vy: 12%; --vw: 70%;
  --m-pos: center 70%;
  --fade-a: 32%; --fade-b: 58%;
  --brown: #2A1A0E;
  --brown-soft: #3A2414;
  --clay: #5A2C0C;
  --nav-fg: #FFF1DE;
  --navbtn-bg: #FFF1DE; --navbtn-fg: #2A1A0E;
  --frame: rgba(255, 241, 222, 0.55);
  --frame-fill: rgba(255, 241, 222, 0.10);
  --play: #FFF1DE;
  --cap: #FFF1DE;
}
/* Photo: beige columns with flower reliefs */
:root[data-img="columns"] {
  --img: url("hero-columns.png");
  --ratio: 551 / 980;
  --art-pos: right center;
  --page: linear-gradient(180deg, #988A6F 0%, #9E8F73 35%, #A39274 60%, #B3A285 78%, #93856A 88%, #AD9F84 100%);
  --page-solid: #988A6F;
  --vx: 2%; --vy: 41%; --vw: 60%;
  --m-pos: center 40%;
  --brown: #24180F;
  --brown-soft: #2E2016;
  --clay: #4A2A15;
  --frame: rgba(36, 24, 15, 0.38);
}
:root[data-font="fraunces"] { --display: "Fraunces", "Iowan Old Style", Georgia, serif; }
:root[data-font="jost"] { --display: "Jost", "Futura", "Century Gothic", sans-serif; }
:root[data-font="shrikhand"] { --display: "Shrikhand", "Cooper Black", serif; }

* { box-sizing: border-box; }
html { background: var(--page-solid); }
body { min-height: 100vh; margin: 0; background: var(--page-solid); color: var(--brown); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

/* Draft-only pickers: always light so they read on every photo */
.draft {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px;
  padding: 10px var(--side);
  background: #F4EEE8; color: #5E4637;
  font-size: 0.85rem;
}
.draft .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.draft .group > span { margin-right: 6px; }
.draft button { background: transparent; border: 1px solid rgba(58, 42, 31, 0.32); color: #3A2A1F; padding: 5px 12px; cursor: pointer; font-size: 0.85rem; border-radius: 0; }
.draft button[aria-pressed="true"] { background: #3A2A1F; color: var(--cream); border-color: #3A2A1F; }
.draft button[data-v="bodoni"] { font-family: "Bodoni Moda", serif; font-style: italic; }
.draft button[data-v="fraunces"] { font-family: "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1; }
.draft button[data-v="jost"] { font-family: "Jost", sans-serif; letter-spacing: 0.02em; }
.draft button[data-v="shrikhand"] { font-family: "Shrikhand", serif; }

.hero {
  position: relative;
  min-height: max(calc(100svh - 46px), 720px);
  overflow: hidden;
  isolation: isolate;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-inline: var(--side);
  padding-bottom: 48px;
  background: var(--page);
}

/* ---------- Photo + video stage (sized to the photo) ---------- */
.stage {
  position: absolute; z-index: 0; top: 0; right: 0; bottom: 0;
  aspect-ratio: var(--ratio); height: 100%;
}
.art {
  position: absolute; inset: 0;
  background-image: var(--img);
  background-size: cover;
  background-position: var(--art-pos);
  background-repeat: no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) var(--fade-a), #000 var(--fade-b));
          mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.7) var(--fade-a), #000 var(--fade-b));
}
.video {
  position: absolute; z-index: 1;
  left: var(--vx); top: var(--vy); width: var(--vw);
  margin: 0; display: grid; gap: 10px;
}
.video .frame {
  aspect-ratio: 16 / 9; max-width: 100%;
  border: 1px solid var(--frame);
  background: var(--frame-fill);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
}
.video .frame svg { width: 52px; height: 52px; color: var(--play); opacity: 0.9; }
.video figcaption { font-size: 0.85rem; color: var(--cap); }
/* When the video is ready, swap the .frame div for:
   <video class="frame" controls preload="none" playsinline poster="poster.jpg">
     <source src="your-video.mp4" type="video/mp4">
   </video> */
video.frame { width: 100%; height: auto; display: block; object-fit: cover; }

/* ---------- Content ---------- */
.nav { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 26px; color: var(--nav-fg); }
.logo { display: flex; align-items: center; min-height: 44px; font-family: var(--brand); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; text-decoration: none; }
.links { display: flex; gap: 40px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; text-underline-offset: 6px; }
.box {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--btn-bg); color: var(--btn-fg);
  font: 600 0.9rem/1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase;
  padding: 20px 34px; text-decoration: none; border: 0; border-radius: 0; white-space: nowrap;
}
.box:hover { opacity: 0.88; }
.nav .box { background: var(--navbtn-bg); color: var(--navbtn-fg); }
@media (max-width: 1100px) { .links { display: none; } }
@media (max-width: 960px) { .nav .box { padding: 15px 20px; font-size: 0.8rem; } }

.main { position: relative; z-index: 2; align-self: center; display: grid; gap: clamp(28px, 4vw, 44px); padding-block: 24px 40px; max-width: min(56%, 760px); }

h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3.4rem, 8.4vw, 9rem);
  line-height: 0.92;
  letter-spacing: -0.035em;
  font-variation-settings: "opsz" 96;
  color: var(--brown);
}
h1 .l { display: block; }
h1 .it { font-style: italic; font-weight: 500; padding-left: 0.6em; color: var(--clay); }
h1 .big { font-weight: 800; }

/* Fraunces: soft, slightly wonky old-style serif */
:root[data-font="fraunces"] h1 { font-size: clamp(3.2rem, 8vw, 8.6rem); letter-spacing: -0.03em; line-height: 0.95; font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; }
:root[data-font="fraunces"] h1 .it { font-weight: 400; }
:root[data-font="fraunces"] h1 .big { font-weight: 700; }
/* Jost: clean, light geometric sans */
:root[data-font="jost"] h1 { font-weight: 300; font-size: clamp(3.2rem, 8vw, 8.4rem); letter-spacing: -0.045em; line-height: 0.95; font-variation-settings: normal; }
:root[data-font="jost"] h1 .it { font-weight: 300; }
:root[data-font="jost"] h1 .big { font-weight: 500; }
/* Shrikhand: fat, retro, friendly */
:root[data-font="shrikhand"] h1 { font-size: clamp(3rem, 7.6vw, 8rem); letter-spacing: -0.01em; line-height: 1; font-variation-settings: normal; }
:root[data-font="shrikhand"] h1 .it, :root[data-font="shrikhand"] h1 .big { font-style: normal; font-weight: 400; }

.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 26px; }
.cta p { margin: 0; font-size: 1rem; line-height: 1.45; color: var(--brown-soft); max-width: 24ch; }

/* Phones and small tablets: text first, then the video, then the photo */
@media (max-width: 860px) {
  .hero { min-height: auto; grid-template-rows: auto auto auto; padding-bottom: 0; }
  .main { max-width: none; padding-bottom: 28px; }
  .stage { position: relative; inset: auto; aspect-ratio: auto; height: auto; display: grid; margin-inline: calc(-1 * var(--side)); }
  .video { position: relative; left: auto; top: auto; width: auto; margin: 0 var(--side) 8px; }
  .video .frame svg { color: var(--brown); }
  .video figcaption { color: var(--brown-soft); }
  .video .frame { border-color: rgba(58, 42, 31, 0.32); }
  .art { position: relative; inset: auto; height: 440px; background-position: var(--m-pos);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 30%); }
}
</style>

<div class="draft">
  <div class="group" role="group" aria-label="Try a photo (draft only)" data-group="img">
    <span>Draft photo</span>
    <button type="button" data-v="peach" aria-pressed="false">Peach</button>
    <button type="button" data-v="curtain" aria-pressed="true">Curtains</button>
    <button type="button" data-v="sunlit" aria-pressed="false">Evening sun</button>
    <button type="button" data-v="lamp" aria-pressed="false">Lamp glow</button>
    <button type="button" data-v="columns" aria-pressed="false">Columns</button>
  </div>
  <div class="group" role="group" aria-label="Try a headline font (draft only)" data-group="font">
    <span>Font</span>
    <button type="button" data-v="bodoni" aria-pressed="true">Bodoni</button>
    <button type="button" data-v="fraunces" aria-pressed="false">Fraunces</button>
    <button type="button" data-v="jost" aria-pressed="false">Jost</button>
    <button type="button" data-v="shrikhand" aria-pressed="false">Shrikhand</button>
  </div>
</div>

<section class="hero">
  <header class="nav">
    <!-- Logo spot: swap the wordmark for <img src="logo.svg" alt="Reliquo" height="44"> when the logo is ready -->
    <a class="logo" href="#">Reliquo</a>
    <nav class="links" aria-label="Main">
      <a href="#">How it works</a>
      <a href="#">Pricing</a>
      <a href="#">Questions</a>
    </nav>
    <a class="box" href="#">Book a free chat</a>
  </header>

  <div class="main">
    <h1><span class="l">Get your</span><span class="l it">evenings</span><span class="l big">back.</span></h1>
    <div class="cta">
      <a class="box" href="#">Book a free chat</a>
      <p>A free 20-minute call, or coffee in Winnipeg. No pressure.</p>
    </div>
  </div>

  <div class="stage">
    <figure class="video">
      <div class="frame" aria-label="Video space, coming soon">
        <svg viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="27" stroke="currentColor" stroke-width="1.5"/><path d="M23 19.5v17l14-8.5-14-8.5Z" fill="currentColor"/></svg>
      </div>
      <figcaption>Video coming soon</figcaption>
    </figure>
    <div class="art" aria-hidden="true"></div>
  </div>
</section>

<script>
  (function () {
    var root = document.documentElement;
    var defaults = { img: 'peach', font: 'bodoni' };
    var start = { img: 'curtain', font: 'bodoni' };
    function options(group) {
      return Array.prototype.map.call(document.querySelectorAll('[data-group="' + group + '"] button'), function (b) { return b.dataset.v; });
    }
    function pick(group, v) {
      if (options(group).indexOf(v) === -1) v = start[group];
      if (v === defaults[group]) root.removeAttribute('data-' + group); else root.setAttribute('data-' + group, v);
      document.querySelectorAll('[data-group="' + group + '"] button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false');
      });
      try { localStorage.setItem('reliquo-' + group, v); } catch (e) {}
    }
    document.querySelectorAll('.draft [data-group]').forEach(function (g) {
      g.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { pick(g.dataset.group, b.dataset.v); });
      });
    });
    ['img', 'font'].forEach(function (group) {
      var v = start[group];
      try { v = localStorage.getItem('reliquo-' + group) || v; } catch (e) {}
      pick(group, v);
    });
  })();
</script>
